name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-fast:
    name: Python fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked Python environment
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check apps packages scripts tests

      - name: Type check
        run: uv run pyright

      - name: Test fast Python contracts
        run: |
          shopt -s nullglob
          test_paths=(tests apps/*/tests packages/*/tests)
          uv run pytest -q -m "not postgres and not e2e" "${test_paths[@]}"

      - name: Validate release version mapping
        run: uv run python scripts/check-release-versions.py

      - name: Validate generated roadmap contracts
        env:
          ROADMAP_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/dev' }}
          ROADMAP_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base_ref="$ROADMAP_BASE_REF"
          if [[ -z "$base_ref" || "$base_ref" =~ ^0+$ ]]; then base_ref="HEAD^"; fi
          uv run python scripts/roadmap-tools.py check-diff --base-ref "$base_ref" --head-ref "$ROADMAP_HEAD_REF"

  node-fast:
    name: Node fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: pnpm

      - name: Install locked Node environment
        run: pnpm install --frozen-lockfile

      - name: Check Dashboard
        run: pnpm --filter @agentguard/dashboard check

      - name: Test OpenClaw runtime plugin
        run: pnpm --filter @agentguard-ai/openclaw-plugin test

      - name: Test OpenClaw bench tools
        run: pnpm --filter @agentguard/openclaw-bench-tools test

      - name: Test OpenClaw local shims
        run: pnpm openclaw:bench-shim:test
