name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the opt-in local OpenClaw live gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-static:
    name: Python static and repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.12.5"

      - name: Install locked Python environment
        run: uv sync --locked --all-groups

      - name: Verify clean-checkout minimal examples
        run: |
          benign_output="$(uv run python examples/evaluate_events.py examples/events/benign-read.json)"
          blocked_output="$(uv run python examples/evaluate_events.py examples/events/blocked-sensitive-read.json)"
          [[ "$benign_output" == *'"decision": "allow"'* ]]
          [[ "$blocked_output" == *'"decision": "deny"'* ]]
          [[ "$blocked_output" == *'"P001_sensitive_file_access"'* ]]

      - name: Check committed diff hygiene
        env:
          DIFF_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/dev' }}
        run: |
          base_ref="$DIFF_BASE_REF"
          if [[ -z "$base_ref" || "$base_ref" =~ ^0+$ ]]; then base_ref="HEAD^"; fi
          git diff --check "$base_ref...HEAD"
          git diff --check

      - name: Lint
        run: >-
          uv run ruff check apps packages scripts tests examples conftest.py
          agentguard_langgraph_bench/bench/tests/conftest.py

      - name: Check published Python package formatting
        run: >-
          uv run black --check
          apps/cli/agentguard_cli apps/guard-api/guard_api
          packages/agentguard-core/agentguard_core
          packages/agentguard-langgraph-adapter/agentguard_langgraph_adapter

      - name: Type check
        run: uv run pyright

      - name: Validate release version mapping
        run: uv run python scripts/check-release-versions.py

      - name: Validate generated roadmap contracts
        env:
          ROADMAP_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/dev' }}
          ROADMAP_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base_ref="$ROADMAP_BASE_REF"
          if [[ -z "$base_ref" || "$base_ref" =~ ^0+$ ]]; then base_ref="HEAD^"; fi
          uv run python scripts/roadmap-tools.py check-diff --base-ref "$base_ref" --head-ref "$ROADMAP_HEAD_REF"

      - name: Validate all Markdown targets
        run: uv run python scripts/release/check_markdown_links.py

  python-tests:
    name: Python ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, contract, integration, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Roadmap contract tests validate commit ancestry against origin/dev.
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.12.5"

      - name: Install locked Python environment
        run: uv sync --locked --all-groups

      - name: Set up Node.js for cross-language contracts
        if: ${{ matrix.suite == 'contract' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Install integrity-pinned pnpm for cross-language contracts
        if: ${{ matrix.suite == 'contract' }}
        run: |
          corepack enable
          corepack install
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile

      - name: Run ${{ matrix.suite }} tests
        run: uv run pytest -q -m "${{ matrix.suite }}"

  postgres:
    name: PostgreSQL 16 migrations and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_guard_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_guard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENTGUARD_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/agent_guard_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.12.5"

      - name: Install locked Python environment
        run: uv sync --locked --all-groups

      - name: Apply Guard API migrations
        run: >-
          uv run python -c
          "import os; from guard_api.storage.postgres import PostgresControlPlaneStore;
          store = PostgresControlPlaneStore(os.environ['AGENTGUARD_TEST_DATABASE_URL']);
          store.initialize(); assert store.health_check(), 'PostgreSQL health check failed after migration'"

      - name: Run PostgreSQL tests
        run: uv run pytest -q -m postgres

  node-quality:
    name: Node quality and contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Install integrity-pinned pnpm
        run: |
          corepack enable
          corepack install
          test "$(pnpm --version)" = "11.9.0"

      - name: Install locked Node environment
        run: pnpm install --frozen-lockfile

      - name: Check Dashboard source
        run: |
          pnpm --filter @agentguard/dashboard format:check
          pnpm --filter @agentguard/dashboard lint
          pnpm --filter @agentguard/dashboard typecheck
          pnpm --filter @agentguard/dashboard test:unit

      - name: Test OpenClaw runtime plugin
        run: pnpm --filter @agentguard-ai/openclaw-plugin test

      - name: Test OpenClaw bench tools
        run: pnpm --filter @agentguard/openclaw-bench-tools test

      - name: Test OpenClaw local shims
        run: pnpm openclaw:bench-shim:test

  dashboard-build:
    name: Dashboard production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Install integrity-pinned pnpm
        run: |
          corepack enable
          corepack install
          test "$(pnpm --version)" = "11.9.0"

      - name: Install locked Node environment
        run: pnpm install --frozen-lockfile

      - name: Build Dashboard
        run: pnpm --filter @agentguard/dashboard build

  clean-clone-acceptance:
    name: Clean-clone product acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.12.5"

      - name: Install locked Python environment
        run: uv sync --locked --all-groups

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Install integrity-pinned pnpm and workspace
        run: |
          corepack enable
          corepack install
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile

      - name: Run isolated API, policy, audit, and Dashboard acceptance
        run: >-
          uv run --frozen python
          scripts/release/productization_alpha_acceptance.py --json

  browser-e2e:
    name: Playwright Chromium E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Set up uv and Python for real API browser E2E
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.12.5"

      - name: Install integrity-pinned pnpm
        run: |
          corepack enable
          corepack install
          test "$(pnpm --version)" = "11.9.0"

      - name: Install locked Node environment
        run: pnpm install --frozen-lockfile

      - name: Install locked Python environment for real API browser E2E
        run: uv sync --locked --all-groups

      - name: Install Playwright Chromium
        run: pnpm --filter @agentguard/dashboard exec playwright install --with-deps chromium

      - name: Run Dashboard mock-mode browser E2E
        run: pnpm --filter @agentguard/dashboard test:e2e

      - name: Run Dashboard API-mode browser E2E
        run: pnpm --filter @agentguard/dashboard test:e2e:api

      - name: Run Dashboard real Guard API memory E2E
        env:
          AGENTGUARD_S1_STORAGE_BACKEND: memory
        run: pnpm --filter @agentguard/dashboard test:e2e:s1-live

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ github.sha }}
          path: |
            apps/dashboard/playwright-report/
            apps/dashboard/test-results/
            apps/dashboard/test-results-api/
            apps/dashboard/test-results-s1-live-memory/
          if-no-files-found: ignore
          retention-days: 7

  live:
    name: Manual OpenClaw live gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AGENTGUARD_RTE05_LIVE_GATE: "1"
      AGENTGUARD_RTE05_STORAGE_BACKEND: memory
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.12.5"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Install integrity-pinned pnpm
        run: |
          corepack enable
          corepack install
          test "$(pnpm --version)" = "11.9.0"

      - name: Install locked environments
        run: |
          uv sync --locked --all-groups
          pnpm install --frozen-lockfile

      - name: Build OpenClaw plugin
        run: pnpm --filter @agentguard-ai/openclaw-plugin build

      - name: Run explicitly enabled live tests
        run: uv run pytest -q -m live
