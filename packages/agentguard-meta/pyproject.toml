[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agentguard"
version = "0.1.0b1"
description = "AgentGuard installation entry point"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AEGIS Team" }]
keywords = ["agent", "ai", "security", "runtime-guard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = ["aegis-agentguard-core==0.1.0b1"]

[project.optional-dependencies]
api = ["aegis-agentguard-api==0.1.0b1"]
cli = ["aegis-agentguard-cli==0.1.0b1"]
all = [
  "aegis-agentguard-api==0.1.0b1",
  "aegis-agentguard-cli==0.1.0b1",
]

[project.urls]
Homepage = "https://github.com/JToday666/agent-guard"
Repository = "https://github.com/JToday666/agent-guard"
Issues = "https://github.com/JToday666/agent-guard/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis_agentguard*"]

[tool.setuptools.package-data]
aegis_agentguard = ["py.typed"]
