[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-langgraph-adapter"
version = "0.1.0rc1"
description = "LangGraph runtime adapter SDK for AgentGuard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "cryptography>=46.0.5",
  "httpx>=0.28",
  "pydantic>=2.9",
]

[project.optional-dependencies]
native = [
  "langgraph==1.2.7",
  "langgraph-prebuilt==1.1.0",
  "langchain-core==1.4.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentguard_langgraph_adapter*"]
