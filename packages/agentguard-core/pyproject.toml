[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-core"
version = "0.1.0b1"
description = "Stateless AgentGuard Core security decision engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AEGIS Team" }]
keywords = ["agent", "ai", "security", "prompt-injection", "runtime-guard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/JToday666/agent-guard"
Repository = "https://github.com/JToday666/agent-guard"
Issues = "https://github.com/JToday666/agent-guard/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentguard_core*"]

[tool.setuptools.package-data]
agentguard_core = ["py.typed"]
