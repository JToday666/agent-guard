[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-core"
version = "0.1.0"
description = "Formal AgentGuard Core policy, audit, approval, and metrics services"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "psycopg[binary]>=3.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentguard_core*"]
