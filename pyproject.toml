[project]
name = "agent-guard"
version = "0.1.0"
description = "Formal AgentGuard Core and API service"
requires-python = ">=3.12"
dependencies = [
  "aegis-agentguard-cli",
  "aegis-agentguard-core",
  "aegis-agentguard-api",
  "httpx>=0.28",
]

[dependency-groups]
bench = [
  "agentguard-langgraph-bench",
  "agentguard-langgraph-adapter",
]
dev = [
  "black>=25.1.0",
  "httpx2>=2.10.0",
  "jsonschema>=4.26",
  "pyright>=1.1.390",
  "pytest>=9",
  "ruff>=0.15.20",
]

[tool.uv]
package = false
required-version = "==0.12.5"

[tool.uv.sources]
aegis-agentguard-cli = { path = "apps/cli", editable = true }
aegis-agentguard-core = { path = "packages/agentguard-core", editable = true }
aegis-agentguard-api = { path = "apps/guard-api", editable = true }
agentguard-langgraph-bench = { path = "agentguard_langgraph_bench/bench", editable = true }
agentguard-langgraph-adapter = { path = "packages/agentguard-langgraph-adapter", editable = true }

[tool.black]
target-version = ["py312"]
extend-exclude = "(^|/)(agentguard_langgraph_bench|migrations|node_modules)/"

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
testpaths = [
  "tests",
  "packages/agentguard-langgraph-adapter/tests",
]
markers = [
  "unit: isolated tests without process, network, database, or external-host dependencies",
  "contract: schemas, frozen contracts, and cross-implementation public behavior",
  "integration: multi-component tests that do not require PostgreSQL or an external host",
  "postgres: PostgreSQL migration, persistence, parity, and concurrency tests",
  "e2e: local end-to-end or cross-process tests without a real external provider",
  "live: explicit opt-in tests against a real host or provider; never part of automatic CI",
]
