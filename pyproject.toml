[project]
name = "agent-guard"
version = "0.1.0"
description = "Formal AgentGuard Core and API service"
requires-python = ">=3.12"
dependencies = [
  "aegis-agentguard",
  "aegis-agentguard-cli",
  "aegis-agentguard-core",
  "aegis-agentguard-api",
  "httpx>=0.28",
]

[dependency-groups]
bench = [
  "agentguard-langgraph-bench",
  "agentguard-langgraph-adapter",
]
dev = [
  "black>=25.1.0",
  "jsonschema>=4.26",
  "pyright>=1.1.390",
  "pytest>=9",
  "ruff>=0.15.20",
]

[tool.uv]
package = false

[tool.uv.sources]
aegis-agentguard = { path = "packages/agentguard-meta", editable = true }
aegis-agentguard-cli = { path = "apps/cli", editable = true }
aegis-agentguard-core = { path = "packages/agentguard-core", editable = true }
aegis-agentguard-api = { path = "apps/guard-api", editable = true }
agentguard-langgraph-bench = { path = "agentguard_langgraph_bench/bench", editable = true }
agentguard-langgraph-adapter = { path = "packages/agentguard-langgraph-adapter", editable = true }

[tool.black]
target-version = ["py312"]
extend-exclude = "(^|/)(agentguard_langgraph_bench|migrations|node_modules)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
