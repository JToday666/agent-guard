[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agentguard-api"
version = "0.1.0b1"
description = "Guard API / Control Plane service for AgentGuard"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AEGIS Team" }]
keywords = ["agent", "ai", "security", "fastapi", "audit", "approval"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "aegis-agentguard-core==0.1.0b1",
  "alembic>=1.16",
  "fastapi>=0.136",
  "httpx>=0.28",
  "psycopg[binary]>=3.3",
  "SQLAlchemy>=2.0",
  "uvicorn>=0.49",
]

[project.scripts]
agentguard-api = "guard_api.__main__:main"

[project.urls]
Homepage = "https://github.com/JToday666/agent-guard"
Repository = "https://github.com/JToday666/agent-guard"
Issues = "https://github.com/JToday666/agent-guard/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["guard_api*"]

[tool.setuptools.package-data]
guard_api = [
  "migrations/*.py",
  "migrations/versions/*.py",
]
