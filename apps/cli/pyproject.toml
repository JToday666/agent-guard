[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agentguard-cli"
version = "0.1.0b1"
description = "Headless command-line control utility for AgentGuard"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AEGIS Team" }]
keywords = ["agent", "ai", "security", "cli", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.28",
]

[project.scripts]
agentguardctl = "agentguard_cli.cli:main"

[project.urls]
Homepage = "https://github.com/JToday666/agent-guard"
Repository = "https://github.com/JToday666/agent-guard"
Issues = "https://github.com/JToday666/agent-guard/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentguard_cli*"]
