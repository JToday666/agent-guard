<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SwipeApp</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(to right, #ff5e62, #ff9966);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background-color: #fff;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .form-control:focus {
      border-color: #ff5e62;
      box-shadow: 0 0 5px rgba(255, 94, 98, 0.8);
    }
    .btn-primary {
      background-color: #ff5e62;
      border: none;
    }
    .btn-primary:hover {
      background-color: #ff9966;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2 class="text-center mb-4">Welcome Back!</h2>
    <form id="login-form">
      <div class="mb-3">
        <label for="login-email" class="form-label">Email address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="login-email" required>
        </div>
      </div>
      <div class="mb-3">
        <label for="login-password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="login-password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
      <p class="text-center mt-3">Don't have an account? <a href="register.html">Sign up here</a></p>
    </form>
  </div>

  <script src="script.js"></script>

<script>
(() => {
  if (window.__observableRecorderBooted) return;
  window.__observableRecorderBooted = true;
  const PAGE_TYPE = "tinder";
  const url = new URL(window.location.href);
  const API_BASE = url.searchParams.get('api_base') || `${window.location.origin}/api`;
  const runId = url.searchParams.get('run_id');
  const mode = url.searchParams.get('mode') || 'record';
  const recorder = { enabled: mode !== 'replay' && !!runId, phase: 'running', closeSent: false, events: [], flushPromise: null };
  function nowIso() { return new Date().toISOString(); }
  function slugify(text) { return String(text || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 64); }
  function injectChrome() {
    if (!document.body || document.getElementById('taskStatusPill')) return;
    const pill = document.createElement('div');
    pill.id = 'taskStatusPill';
    pill.textContent = recorder.enabled ? 'Recorder armed' : 'Replay mode';
    pill.style.cssText = 'position:fixed;top:14px;right:14px;z-index:2147483647;background:#0f172a;color:#fff;padding:8px 12px;border-radius:999px;font:12px/1.2 Arial,sans-serif;box-shadow:0 8px 24px rgba(15,23,42,.28);max-width:360px;';
    document.body.appendChild(pill);
    const banner = document.createElement('div');
    banner.id = 'taskCompleteBanner';
    banner.style.cssText = 'display:none;position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:2147483646;min-width:360px;max-width:760px;background:#ecfeff;color:#0f172a;border:1px solid #67e8f9;border-radius:14px;padding:14px 18px;box-shadow:0 12px 28px rgba(15,23,42,.18);font:14px/1.45 Arial,sans-serif;';
    banner.innerHTML = '<div id="taskCompleteBannerTitle" style="font-weight:700;margin-bottom:4px;">Recorder active</div><div id="taskCompleteBannerMeta"></div>';
    document.body.appendChild(banner);
  }
  function updateStatus(message) { injectChrome(); const pill = document.getElementById('taskStatusPill'); if (pill) pill.textContent = message; }
  function showBanner(title, meta) { injectChrome(); const banner = document.getElementById('taskCompleteBanner'); const titleNode = document.getElementById('taskCompleteBannerTitle'); const metaNode = document.getElementById('taskCompleteBannerMeta'); if (titleNode) titleNode.textContent = title; if (metaNode) metaNode.textContent = meta || ''; if (banner) banner.style.display = 'block'; }
  function findLabel(el) {
    if (!el) return null;
    if (el.id) {
      const explicit = document.querySelector(`label[for="${CSS.escape(el.id)}"]`);
      if (explicit) return explicit.textContent.trim();
    }
    const implicit = el.closest('label');
    if (implicit) return implicit.textContent.trim();
    return null;
  }
  function elementValue(el) {
    if (!el) return null;
    if (el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return el.value;
    if (el.tagName === 'INPUT') {
      if (el.type === 'checkbox' || el.type === 'radio') return !!el.checked;
      if (el.type === 'file') return Array.from(el.files || []).map(f => f.name);
      return el.value;
    }
    return null;
  }
  function serializeTarget(el) {
    if (!el || !el.tagName) return null;
    return {
      tag: el.tagName.toLowerCase(),
      id: el.id || null,
      name: el.getAttribute('name') || null,
      type: el.getAttribute('type') || null,
      placeholder: el.getAttribute('placeholder') || null,
      label: findLabel(el),
      text: (el.innerText || el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 120) || null,
      testId: el.getAttribute('data-pw') || null,
      value: elementValue(el),
    };
  }
  function queueEvent(type, target, extra) {
    if (!recorder.enabled) return;
    recorder.events.push({ type, ts: nowIso(), page_type: PAGE_TYPE, page: { url: window.location.href, path: window.location.pathname, title: document.title }, target: serializeTarget(target), extra: extra || {} });
    if (recorder.events.length >= 8) flushEvents(true);
  }
  function beaconJson(url, payload) {
    try {
      if (navigator.sendBeacon) {
        const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        return navigator.sendBeacon(url, blob);
      }
    } catch (err) {}
    try { fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true }); return true; } catch (err) { return false; }
  }
  async function flushEvents(useKeepalive) {
    if (!recorder.enabled || !recorder.events.length) return { ok: true, batchEvents: 0 };
    if (recorder.flushPromise) return recorder.flushPromise;
    const batch = recorder.events.splice(0, recorder.events.length);
    recorder.flushPromise = fetch(`${API_BASE}/runs/${encodeURIComponent(runId)}/events`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ events: batch }), keepalive: !!useKeepalive }).then(async (response) => {
      if (!response.ok) { recorder.events = batch.concat(recorder.events); updateStatus('Recorder flush failed'); return { ok: false, status: response.status }; }
      const data = await response.json().catch(() => ({}));
      updateStatus(`Recorder saved ${data.batch_events || batch.length} event(s)`);
      return data;
    }).catch(() => { recorder.events = batch.concat(recorder.events); updateStatus('Recorder flush failed'); return { ok: false }; }).finally(() => { recorder.flushPromise = null; });
    return recorder.flushPromise;
  }
  function collectFields(root) {
    const out = {};
    (root || document).querySelectorAll('input, select, textarea').forEach((el, idx) => {
      const key = el.getAttribute('data-pw') || el.id || el.name || `${el.tagName.toLowerCase()}-${idx + 1}`;
      if (el.type === 'checkbox' || el.type === 'radio') out[key] = !!el.checked;
      else if (el.type === 'file') out[key] = Array.from(el.files || []).map(f => ({ name: f.name, size: f.size, type: f.type }));
      else out[key] = el.value;
    });
    return out;
  }
  function collectState() {
    return { page_type: PAGE_TYPE, path: window.location.pathname, title: document.title, task_status: document.getElementById('taskStatusPill') ? document.getElementById('taskStatusPill').textContent : null, fields: collectFields(document) };
  }
  async function finalizeRun(reason, state, source) {
    if (!recorder.enabled) return;
    if (recorder.phase === 'finalized') return;
    recorder.phase = 'finalizing';
    queueEvent('task_completed', document.body, { reason, state });
    await flushEvents(true);
    const remainingEvents = recorder.events.splice(0, recorder.events.length);
    updateStatus('Finalizing run...');
    showBanner('Task Completed', 'Behavior log captured and forwarded for compilation.');
    try {
      const response = await fetch(`${API_BASE}/runs/${encodeURIComponent(runId)}/finalize`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ done: true, done_reason: reason, force_finalize: false, finalize_source: source || 'completion_oracle', page_type: PAGE_TYPE, entry_path: window.location.pathname, state, events: remainingEvents }), keepalive: true });
      if (!response.ok) { recorder.phase = 'running'; updateStatus('Finalize failed'); return; }
      const data = await response.json().catch(() => ({}));
      recorder.phase = 'finalized';
      const scriptPath = data.generated_script || 'generated/replay_from_events.py';
      updateStatus(`Compiler output ready: ${scriptPath}`);
      showBanner('Task Completed', `Compiler output ready: ${scriptPath}`);
    } catch (err) { recorder.phase = 'running'; updateStatus('Finalize failed'); }
  }
  function forceFinalize(runEndReason) {
    if (!recorder.enabled || recorder.closeSent || recorder.phase === 'finalized') return;
    recorder.closeSent = true;
    queueEvent('context_close_signal', document.body, { run_end_reason: runEndReason });
    const state = collectState();
    beaconJson(`${API_BASE}/runs/${encodeURIComponent(runId)}/close`, { events: recorder.events.splice(0, recorder.events.length), finalize: { done: false, done_reason: 'context_close', force_finalize: true, finalize_source: 'context_close', run_end_reason: runEndReason, page_type: PAGE_TYPE, entry_path: window.location.pathname, state } });
  }
function appendRuntimeParams(rawUrl) {
  try {
    if (!rawUrl) return rawUrl;
    const value = String(rawUrl).trim();
    if (!value || value.startsWith('#') || value.startsWith('javascript:') || value.startsWith('mailto:') || value.startsWith('tel:')) return rawUrl;
    const target = new URL(value, window.location.href);
    if (!target.pathname.endsWith('.html')) return rawUrl;
    ['run_id', 'api_base', 'mode', 'replay_of'].forEach((name) => {
      const current = url.searchParams.get(name);
      if (current && !target.searchParams.has(name)) target.searchParams.set(name, current);
    });
    return target.toString();
  } catch (err) {
    return rawUrl;
  }
}
function propagateRuntimeParams() {
  document.querySelectorAll('a[href]').forEach((link) => {
    const href = link.getAttribute('href');
    const patched = appendRuntimeParams(href);
    if (patched && patched !== href) link.setAttribute('href', patched);
  });
  document.querySelectorAll('form[action]').forEach((form) => {
    const action = form.getAttribute('action');
    const patched = appendRuntimeParams(action);
    if (patched && patched !== action) form.setAttribute('action', patched);
  });
}
  function patchStableAttributes() {
    document.querySelectorAll('input, select, textarea, button, a').forEach((el, idx) => {
      if (el.hasAttribute('data-pw')) return;
      const preferred = el.id || el.getAttribute('name') || ((el.tagName === 'BUTTON' || el.tagName === 'A') ? slugify(el.textContent || el.innerText || '') : '') || `${el.tagName.toLowerCase()}-${idx + 1}`;
      el.setAttribute('data-pw', preferred || `${el.tagName.toLowerCase()}-${idx + 1}`);
    });
  }
  function setupGenericListeners() {
    document.addEventListener('input', (event) => { queueEvent('input', event.target, { value: elementValue(event.target), files: event.target && event.target.type === 'file' ? Array.from(event.target.files || []).map(f => ({ name: f.name, size: f.size, type: f.type })) : undefined }); }, true);
    document.addEventListener('change', (event) => { queueEvent('change', event.target, { value: elementValue(event.target), files: event.target && event.target.type === 'file' ? Array.from(event.target.files || []).map(f => ({ name: f.name, size: f.size, type: f.type })) : undefined }); }, true);
    document.addEventListener('focusin', (event) => { queueEvent('focusin', event.target); }, true);
    document.addEventListener('focusout', (event) => { queueEvent('focusout', event.target); }, true);
    document.addEventListener('keydown', (event) => { if (['Enter', 'Tab'].includes(event.key)) queueEvent('keydown', event.target, { key: event.key }); }, true);
    document.addEventListener('click', (event) => { const target = event.target && event.target.closest ? event.target.closest('button, a, input[type="button"], input[type="submit"], [role="button"]') : event.target; queueEvent('click', target || event.target, { x: event.clientX, y: event.clientY }); }, true);
  }
  function bindFormsTemplate() {
    document.querySelectorAll('form').forEach((form) => { form.addEventListener('submit', (event) => { event.preventDefault(); event.stopImmediatePropagation(); if (form.reportValidity && !form.reportValidity()) return; finalizeRun('forms_submit', collectState(), 'completion_oracle'); }, true); });
  }
  function bindTikTokTemplate() {
    const form = document.querySelector('form');
    const nextBtn = document.getElementById('next-btn');
    if (nextBtn) nextBtn.addEventListener('click', (event) => { const txt = (nextBtn.textContent || '').trim().toLowerCase(); if (!txt.includes('submit')) return; if (form && form.reportValidity && !form.reportValidity()) { form.reportValidity(); return; } event.preventDefault(); event.stopImmediatePropagation(); queueEvent('business_submit_click', nextBtn, { buttonText: nextBtn.textContent }); finalizeRun('tiktok_submit', collectState(), 'completion_oracle'); }, true);
    if (form) form.addEventListener('submit', (event) => { event.preventDefault(); event.stopImmediatePropagation(); if (form.reportValidity && !form.reportValidity()) return; finalizeRun('tiktok_submit', collectState(), 'completion_oracle'); }, true);
  }
  function bindTinderTemplate() {
    document.querySelectorAll('form').forEach((form) => { form.addEventListener('submit', (event) => { event.preventDefault(); event.stopImmediatePropagation(); if (form.reportValidity && !form.reportValidity()) return; const reason = form.id === 'login-form' ? 'tinder_login_submit' : 'tinder_register_submit'; finalizeRun(reason, collectState(), 'completion_oracle'); }, true); });
  }
  function bindTemplate() { if (PAGE_TYPE === 'forms') bindFormsTemplate(); else if (PAGE_TYPE === 'tiktok') bindTikTokTemplate(); else if (PAGE_TYPE === 'tinder') bindTinderTemplate(); }
  function init() { injectChrome(); patchStableAttributes(); propagateRuntimeParams(); setupGenericListeners(); bindTemplate(); updateStatus(recorder.enabled ? 'Recorder armed' : 'Replay mode'); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true }); else init();
  window.addEventListener('pagehide', () => forceFinalize('pagehide'));
  window.addEventListener('beforeunload', () => forceFinalize('beforeunload'));
})();
</script>
</body>
</html>
