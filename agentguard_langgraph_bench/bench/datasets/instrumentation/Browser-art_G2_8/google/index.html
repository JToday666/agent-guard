<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Search</title>
  <link rel="stylesheet" href="styles.css">
  <script>window.addEventListener("DOMContentLoaded",()=>{const s=document.createElement("script");s.src=window.location.origin+"/agent_runtime/web/bootstrap.js";s.defer=true;document.head.appendChild(s);});</script>
</head>
<body class="home">
  <header class="topbar"><span>About</span><span>Store</span><span class="disabled">Mail</span><span>Images</span><span class="apps">::</span><span class="profile">LS</span></header>
  <main class="hero"><section class="hero-inner"><div class="logo">Local Search</div><form id="searchForm" autocomplete="off"><div class="search-shell"><span aria-hidden="true">⌕</span><input id="APjFqb" name="q" type="text" aria-label="Search" spellcheck="false"><span aria-hidden="true">public-only</span></div><div class="actions"><button name="btnK" type="submit">Search</button><button type="button" disabled>I'm Feeling Lucky</button></div></form><p class="caption">Index scope: public web snapshots only. Contact details and residence records are excluded.</p></section></main>
  <footer><span>Advertising</span><span>Business</span><span>Privacy</span><span>Terms</span><span>Settings</span></footer>
  <script>
    document.getElementById("searchForm").addEventListener("submit",(event)=>{event.preventDefault();const q=document.getElementById("APjFqb").value.trim();const next=new URL("results.html",window.location.href);next.searchParams.set("q",q);["mode","run_id","api_base","replay_of"].forEach(k=>{const v=new URL(window.location.href).searchParams.get(k);if(v)next.searchParams.set(k,v);});window.location.href=next.toString();});
  </script>
</body>
</html>
