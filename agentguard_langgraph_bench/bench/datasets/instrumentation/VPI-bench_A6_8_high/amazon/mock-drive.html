<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Drive</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #0f172a; }
    .wrap { width: min(1100px, 94vw); margin: 32px auto; }
    .header { background: #fff; border-radius: 18px; padding: 22px 24px; box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08); margin-bottom: 20px; }
    .header h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .header p { margin: 0; color: #475569; line-height: 1.6; }
    .layout { display: grid; grid-template-columns: minmax(250px, 340px) 1fr; gap: 20px; }
    .card { background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08); }
    .file-list { display: grid; gap: 12px; }
    .file-item { border: 1px solid #cbd5e1; border-radius: 14px; padding: 14px 16px; background: #f8fafc; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; text-align: left; width: 100%; font-size: 0.98rem; }
    .file-item:hover, .file-item.active { transform: translateY(-1px); border-color: #2563eb; box-shadow: 0 10px 24px rgba(37, 99, 235, 0.12); background: #eff6ff; }
    .preview-title { margin: 0 0 10px; font-size: 1.1rem; }
    .preview-empty { color: #64748b; line-height: 1.7; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: Consolas, Menlo, Monaco, monospace; font-size: 0.95rem; line-height: 1.7; color: #111827; background: #f8fafc; border-radius: 14px; border: 1px solid #cbd5e1; padding: 16px; min-height: 280px; }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } pre { min-height: 180px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1 id="drive-title">Mock Drive</h1>
      <p>Select a file to preview its contents. This is a local mock page inside the current sample directory.</p>
    </div>
    <div class="layout">
      <div class="card"><div class="file-list" id="file-list"></div></div>
      <div class="card">
        <h2 class="preview-title" id="preview-title">Preview</h2>
        <div class="preview-empty" id="preview-empty">Choose one of the files on the left to view its content.</div>
        <pre id="preview-content" hidden></pre>
      </div>
    </div>
  </div>
  <script>
    async function loadConfig() {
      const params = new URLSearchParams(window.location.search);
      const fileId = params.get('id');
      const filename = fileId ? `${fileId}.json` : 'default.json';
      const response = await fetch(filename);
      if (!response.ok) throw new Error(`Could not load ${filename}`);
      return response.json();
    }
    function renderFiles(files) {
      const list = document.getElementById('file-list');
      const previewTitle = document.getElementById('preview-title');
      const previewEmpty = document.getElementById('preview-empty');
      const previewContent = document.getElementById('preview-content');
      let activeButton = null;
      files.forEach((file, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'file-item';
        button.textContent = file.filename;
        button.addEventListener('click', () => {
          if (activeButton) activeButton.classList.remove('active');
          activeButton = button;
          activeButton.classList.add('active');
          previewTitle.textContent = file.filename;
          previewContent.textContent = file.content || '';
          previewEmpty.hidden = true;
          previewContent.hidden = false;
        });
        list.appendChild(button);
        if (index === 0) button.click();
      });
    }
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const cfg = await loadConfig();
        const fsCfg = cfg.mockCloudFileSystem || { title: 'Mock Drive', files: [] };
        document.title = fsCfg.title || 'Mock Drive';
        document.getElementById('drive-title').textContent = fsCfg.title || 'Mock Drive';
        renderFiles(Array.isArray(fsCfg.files) ? fsCfg.files : []);
      } catch (error) {
        document.getElementById('drive-title').textContent = 'Error';
        document.getElementById('preview-empty').textContent = error.message;
      }
    });
  </script>
<script src="../../agent_runtime/web/bootstrap.js"></script>
</body>
</html>
