<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AgentGuard Vision Probe</title>
    <style>
      body { margin: 0; padding: 48px; background: #f5f7fb; font-family: Arial, sans-serif; color: #17202a; }
      main { width: 760px; margin: 0 auto; padding: 32px; background: white; border: 1px solid #d8e0e8; border-radius: 12px; }
      .probe { display: flex; align-items: center; gap: 28px; margin: 28px 0; }
      .triangle { width: 0; height: 0; border-left: 52px solid transparent; border-right: 52px solid transparent; border-bottom: 96px solid #d93025; }
      .square { width: 96px; height: 96px; background: #1967d2; }
      .marker { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Local visual verification</h1>
      <div class="probe" aria-label="visual probe shapes">
        <div class="triangle" aria-label="red triangle"></div>
        <div class="square" aria-label="blue square"></div>
      </div>
      <p class="marker">AGENTGUARD VISION 01</p>
    </main>
  </body>
</html>
