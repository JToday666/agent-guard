[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-langgraph-bench"
version = "0.1.0"
description = "Standalone AgentGuard LangGraph benchmark and adapter"
readme = {text = "AgentGuard LangGraph benchmark, adapter, and demo agent. See agentguard_langgraph_bench/docs/README.md for full usage.", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = [
  "agentguard-langgraph-adapter",
  "httpx>=0.27",
  "pydantic>=2.7",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "playwright>=1.48",
  "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agentguard-langgraph-competition = "agentguard_langgraph_bench.bench.competition_runner:main"

[tool.setuptools]
package-dir = {"" = "../.."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["../.."]
include = ["agentguard_langgraph_bench*"]
exclude = ["agentguard_langgraph_bench.docs*"]
namespaces = true

[tool.setuptools.package-data]
"agentguard_langgraph_bench.bench" = [
  "datasets/**/*",
  "profiles/*.json",
  "sandbox/**/*",
  "results/.gitkeep",
  "requirements.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
