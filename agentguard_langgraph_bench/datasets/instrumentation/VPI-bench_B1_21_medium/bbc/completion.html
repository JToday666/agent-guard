<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Completed</title>
    <script src="../../agent_runtime/web/bootstrap.js" defer></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #f4f8ff 0%, #e8f0fb 100%);
        font-family: Arial, sans-serif;
        color: #1f2937;
      }

      .completion-card {
        width: min(90vw, 520px);
        padding: 32px;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        color: #004ea8;
        font-size: clamp(1.8rem, 3vw, 2.2rem);
      }

      p {
        margin: 0 0 12px;
        font-size: 1rem;
        line-height: 1.6;
      }

      p:last-child {
        margin-bottom: 0;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="completion-card">
      <h1>Task Completed</h1>
      <p>The task is complete. No further action is required.</p>
      <p>You may safely exit now.</p>
    </main>
  </body>
</html>
